<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Corner index "N": a geometric letter as a path (no font dependency). -->
    <path id="n" d="M0 0H22L58 58V0H78V96H56L20 38V96H0Z"/>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="#1c1a18"/>

  <!-- The card -->
  <g transform="rotate(-7 512 512)" filter="url(#shadow)">
    <rect x="262" y="142" width="500" height="740" rx="54" fill="#f7f1e3"/>
    <rect x="286" y="166" width="452" height="692" rx="36" fill="none" stroke="#c8102e" stroke-width="5" opacity="0.35"/>

    <!-- Corner indices: N + a small node in place of the suit -->
    <g fill="#c8102e">
      <use href="#n" transform="translate(312 196)"/>
      <circle cx="351" cy="338" r="17"/>
      <g transform="rotate(180 512 512)">
        <use href="#n" transform="translate(312 196)"/>
        <circle cx="351" cy="338" r="17"/>
      </g>
    </g>

    <!-- Central graph -->
    <g stroke="#1c1a18" stroke-width="20" stroke-linecap="round">
      <line x1="458" y1="372" x2="628" y2="478"/>
      <line x1="458" y1="372" x2="404" y2="560"/>
      <line x1="404" y1="560" x2="628" y2="478"/>
      <line x1="628" y1="478" x2="582" y2="672"/>
      <line x1="404" y1="560" x2="582" y2="672"/>
    </g>
    <circle cx="458" cy="372" r="50" fill="#c8102e"/>
    <circle cx="628" cy="478" r="56" fill="#1c1a18"/>
    <circle cx="404" cy="560" r="44" fill="#1c1a18"/>
    <circle cx="582" cy="672" r="46" fill="#c8102e"/>
  </g>
</svg>
