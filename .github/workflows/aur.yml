name: AUR (naipes-bin)

# Publishes packaging/aur/PKGBUILD to the AUR once a release is PUBLISHED
# (owner, 2026-11-06): a draft's assets aren't public, and the PKGBUILD
# downloads the release .deb. Manual runs (re)publish a given version.
#
# Secret: AUR_SSH_PRIVATE_KEY — a key dedicated to this, whose public half
# is on the owner's aur.archlinux.org account. Nothing else is trusted with
# it: no third-party action, and the AUR host key is pinned below.
# Without the secret (AUR registration was closed when this shipped,
# 2026-11-06) the job ends green with a notice and publishes nothing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published release to point naipes-bin at (e.g. 0.7.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  publish:
    name: Update naipes-bin
    # Prereleases never reach the AUR (it would offer them as an upgrade).
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: AUR key configured?
        id: key
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not configured — skipping the AUR publish"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tools
        if: steps.key.outputs.present == 'true'
        run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - name: Version
        if: steps.key.outputs.present == 'true'
        id: version
        env:
          RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
        run: |
          v="${RAW#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a plain release version: $RAW"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # makepkg refuses to run as root.
      - name: PKGBUILD + .SRCINFO for this release
        if: steps.key.outputs.present == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          useradd -m builder
          chown -R builder packaging/aur
          su builder -c "bash packaging/aur/update.sh '$VERSION'"
      - name: Push to the AUR
        if: steps.key.outputs.present == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as
          # listed on aur.archlinux.org (checked 2026-11-06).
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/naipes-bin.git aur
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur/
          cd aur
          git config user.name "Alan"
          git config user.email "96840359+alanahuel@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "naipes-bin is already at $VERSION — nothing to push"
            exit 0
          fi
          git commit -m "naipes-bin $VERSION-1"
          git push origin HEAD:master
