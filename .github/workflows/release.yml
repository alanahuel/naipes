name: Desktop release

on:
  push:
    tags: ["v*"]
  # Manual runs are artifact-only, unsigned, and NEVER create a release.
  # Use this for the first Windows/Linux dress rehearsal without secrets.
  workflow_dispatch:

permissions:
  contents: read

# Serialize separate runs for the same ref; never cancel an upload in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const {version} = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              console.error("Release tag must equal v" + version);
              process.exit(1);
            }
          '
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run lint

  draft:
    name: Prepare one draft
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job succeeds without creating anything on manual rehearsals.
      # Preparing once avoids the publisher's list-miss/create race between OS jobs.
      - name: Create or reuse the tag's draft
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, "");
            const version = tag.slice(1);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const matches = releases.filter(release =>
              release.tag_name === tag || release.tag_name === version);
            if (matches.length > 1) {
              throw new Error(`Multiple releases match ${tag}; resolve them before uploading.`);
            }
            if (matches.length === 1) {
              if (!matches[0].draft) {
                throw new Error(`${tag} is already published; refusing to modify it.`);
              }
              core.info(`Reusing draft ${matches[0].id} for ${tag}`);
              return;
            }
            const {data} = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: version, draft: true,
            });
            core.info(`Created draft ${data.id} for ${tag}`);

  package:
    name: Package (${{ matrix.platform }})
    needs: [quality, draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac-arm64
            builder_args: --mac --arm64
          - os: windows-2025
            platform: windows-x64
            builder_args: --win --x64
          - os: ubuntu-24.04
            platform: linux-x64
            builder_args: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Native renderer tests on this OS
        run: pnpm exec electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: pnpm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      # Unsigned on every platform (no Apple Developer ID, no Windows
      # certificate): electron-builder.yml sets mac.identity: null and
      # notarize: false, so no signing secrets are needed.
      - name: Release → draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish always
      # Version-less copies (owner 2026-11-06) so the website can link
      # releases/latest/download/<name> without a hardcoded version. Plain
      # copies of this job's installers; the update feeds never reference
      # them. --clobber keeps a re-run idempotent; gh finds the tag's draft.
      - name: Version-less installer copies → draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          case "$RUNNER_OS" in
            macOS)   pairs="Naipes-$v-arm64.dmg:Naipes-arm64.dmg" ;;
            Windows) pairs="Naipes-$v-x64-setup.exe:Naipes-x64-setup.exe" ;;
            Linux)   pairs="Naipes-$v-x86_64.AppImage:Naipes-x86_64.AppImage Naipes-$v-amd64.deb:Naipes-amd64.deb" ;;
          esac
          mkdir -p dist/stable
          for pair in $pairs; do
            cp "dist/${pair%%:*}" "dist/stable/${pair##*:}"
          done
          gh release upload "$GITHUB_REF_NAME" dist/stable/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Rehearsal (no publish)
        if: github.event_name == 'workflow_dispatch'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never
      - name: Initialize packaged providers offline (host and packaged Electron Node)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/Naipes.app/Contents"
              payload="$app/Resources/server/standalone"
              runtime="$app/MacOS/Naipes"
              ;;
            Windows)
              payload="dist/win-unpacked/resources/server/standalone"
              runtime="dist/win-unpacked/Naipes.exe"
              ;;
            Linux)
              payload="dist/linux-unpacked/resources/server/standalone"
              runtime="dist/linux-unpacked/naipes"
              ;;
          esac
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$runtime"
      - name: Exercise packaged demo runtime (own Electron, no system Chrome)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/Naipes.app/Contents"
              node scripts/smoke-demo-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/Naipes" --browser
              ;;
            Windows)
              node scripts/smoke-demo-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime dist/win-unpacked/Naipes.exe --browser
              ;;
            Linux)
              xvfb-run -a node scripts/smoke-demo-runtime.mjs --standalone dist/linux-unpacked/resources/server/standalone --runtime dist/linux-unpacked/naipes --browser
              ;;
          esac
      - name: Save installers and update metadata
        uses: actions/upload-artifact@v7
        with:
          name: naipes-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  # The last gate before a human publishes: after ALL three packaging jobs
  # have uploaded, fail the run unless the tag's single draft release holds
  # exactly the 15 verified assets (4 installers + mac updater ZIP + their
  # blockmaps + 3 latest*.yml feeds + 4 version-less installer copies) and the feeds reference those uploads
  # by exact name at the package.json version. Read-only: it never creates,
  # edits, publishes, or deletes anything. Manual rehearsals upload nothing,
  # so there is no draft to verify and the job stays skipped.
  verify:
    name: Verify draft release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub hides drafts from tokens without push access. The commands below
    # remain GET-only; expose this token only to the two API-reading steps.
    permissions:
      contents: write
    steps:
      # The tagged revision — verify exactly what was packaged, not a moving default.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: List every release, drafts included
        env:
          GH_TOKEN: ${{ github.token }}
        # --slurp wraps the paginated pages into one JSON document
        # ([[release,...],[release,...]]); the validator flattens it.
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Select the tag's single draft
        # Machine JSON on stdout (release id + asset ids); warnings on stderr.
        run: pnpm exec tsx scripts/verify-release.ts select "$RUNNER_TEMP/releases.json" --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/draft.json"
      - name: Download the three update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metadata"
          for name in latest-mac.yml latest.yml latest-linux.yml; do
            id=$(DRAFT="$RUNNER_TEMP/draft.json" NAME="$name" node -e '
              const fs = require("node:fs");
              const draft = JSON.parse(fs.readFileSync(process.env.DRAFT, "utf8"));
              const asset = draft.assets.find((entry) => entry.name === process.env.NAME);
              if (asset == null) { console.error("draft has no " + process.env.NAME); process.exit(1); }
              console.log(asset.id);
            ')
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H "Accept: application/octet-stream" > "$RUNNER_TEMP/metadata/$name"
            echo "downloaded $name ($(wc -c < "$RUNNER_TEMP/metadata/$name") bytes)"
          done
      - name: Verify draft assets and update feeds
        run: pnpm exec tsx scripts/verify-release.ts verify "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/metadata" --tag "$GITHUB_REF_NAME"
